name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra_example/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, Validate and Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: infra_example

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Terraform Format
        run: terraform fmt -check -recursive -diff

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        shell: bash
        run: |
          terraform plan \
            -input=false \
            -lock=false \
            -no-color \
            -var-file=terraform.tfvars | tee plan.txt

      - name: Post plan to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = 'infra_example/plan.txt';
            let plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'No plan output.';
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... truncated, see the run log';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Terraform plan\n```\n' + plan + '\n```',
            });